<!doctype html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('error', function(e) {
        if (e.error && typeof e.error === 'object') {
          try {
            console.error('GLOBAL ERROR OBJECT KEYS:', Object.keys(e.error), 'NAME:', e.error.name, 'MESSAGE:', e.error.message);
          } catch(err) {}
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason === 'object') {
          try {
            console.error('UNHANDLED REJECTION KEYS:', Object.keys(e.reason), 'NAME:', e.reason.name, 'MESSAGE:', e.reason.message);
          } catch(err) {}
        }
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
